<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario Integral NLC</title>
<meta name="theme-color" content="#0f1113">
<meta name="color-scheme" content="dark light">
<script>try{if(localStorage.getItem("nlc_tema")==="claro")document.documentElement.setAttribute("data-tema","claro")}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--verde:#b4d334;--verde-osc:#8fa91f;--negro:#16181a;--carbon:#23272b;--gris:#f2f4ee;--borde:#808b6d;--txt:#1b1f24;--suave:#4b5563;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--gris);color:var(--txt)}
header{background:var(--negro);color:#fff;padding:14px 16px 16px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--verde)}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:12px;padding:5px;width:92px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.logo img{display:block;width:100%;height:auto}
.hd h1{margin:0;font-family:Cambria,Georgia,serif;font-size:19px;letter-spacing:.3px;line-height:1.15}
.hd small{display:block;margin-top:4px;color:#c9cfbf;font-size:13px}
.hd .pill{display:inline-block;margin-top:6px;background:rgba(180,211,52,.18);color:var(--verde);border:1px solid rgba(180,211,52,.4);border-radius:20px;padding:2px 10px;font-size:12px}
#bar{height:7px;background:#d9dfc9}
#bar div{height:100%;width:0;background:linear-gradient(90deg,var(--verde-osc),var(--verde));border-radius:0 6px 6px 0;transition:width .3s}
main{padding:16px 16px 120px;max-width:720px;margin:0 auto}
.paso{font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--suave);margin:4px 0 2px}
h2{font-family:Cambria,Georgia,serif;color:var(--negro);font-size:23px;margin:0 0 14px;padding-left:12px;border-left:6px solid var(--verde);line-height:1.2}
.card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:4px 14px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:12px}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:bold;color:var(--carbon)}
input,select,textarea{width:100%;padding:12px;border:2px solid var(--borde);border-radius:10px;font:inherit;font-size:16px;background:#fbfcf8;color:var(--txt);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--verde-osc);box-shadow:0 0 0 3px rgba(180,211,52,.35);background:#fff}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;font:inherit;font-size:15px;min-height:44px;padding:9px 14px;border-radius:22px;border:2px solid var(--borde);background:#fbfcf8;color:var(--carbon);max-width:none;cursor:pointer;transition:all .12s}
.chip.on{background:var(--negro);border-color:var(--negro);color:var(--verde);font-weight:bold}
.revrow{padding:10px 0;border-bottom:1px solid var(--borde)}.revl{font-size:15px;margin-bottom:7px;line-height:1.25}.revrow .chips{flex-wrap:nowrap;gap:5px}.revrow .chip{flex:1 1 0;min-width:0;min-height:44px;padding:10px 0;font-size:13.5px;border-radius:12px;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:12px 8px;border-radius:14px;border:2px solid var(--borde);background:#fff;color:var(--carbon);max-width:none;font-size:16px;cursor:pointer;transition:all .12s}
.tile span{font-size:28px;line-height:1}
.tile.on{border-color:var(--verde-osc);background:var(--negro);color:#fff;box-shadow:0 0 0 3px rgba(180,211,52,.4)}
.tile.on span{filter:none}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--borde);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
.nav button{font:inherit;font-size:17px;padding:14px 18px;border-radius:12px;border:0;background:var(--negro);color:#fff;flex:1;max-width:260px;cursor:pointer;font-weight:bold}
.nav button.sec{background:#e6ead9;color:var(--carbon);flex:.6}
.nav button.ok{background:var(--verde);color:var(--negro)}
.nav button:active{transform:scale(.98)}
.foto{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.foto b{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:15px}
.foto .cnt{font-weight:normal;font-size:12px;background:var(--negro);color:var(--verde);border-radius:12px;padding:2px 9px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--verde-osc);border-radius:12px;padding:12px;color:var(--carbon);background:#f8fbe9;font-size:15px;cursor:pointer}
.add input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding:6px 6px 0 0}
.pdfchip{display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:8px;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px var(--borde);font-size:12px;font-weight:bold}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--borde)}
.msg{background:#f7fbe3;border:1px solid #d8e79a;border-left:5px solid var(--verde);border-radius:10px;padding:11px 12px;margin:12px 0;font-size:14px;color:#3a4210}

.cvlv{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.cvlv button{font:inherit;font-size:15px;min-height:44px;padding:7px 14px;border-radius:22px;border:2px solid var(--borde);background:#fbfcf8;color:var(--carbon);cursor:pointer}
.cvlv button.on{background:var(--negro);border-color:var(--negro);color:var(--verde);font-weight:bold}
.cvtools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cvtools button{font:inherit;font-size:15px;min-height:44px;padding:7px 12px;border-radius:10px;border:2px solid var(--borde);background:#fff;color:var(--carbon);cursor:pointer}
.cvtools button.on{background:var(--verde);border-color:var(--verde-osc);font-weight:bold}
.cvtools button:disabled{opacity:.4}
#cvCanvas{display:block;width:100%;height:340px;touch-action:none;background:#fbfcf8;border:2px solid var(--borde);border-radius:12px}
.cvprompt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eef5ff;border:1.5px solid #9bbbe8;border-radius:12px;padding:10px;margin-top:10px}
.cvprompt[hidden]{display:none}
.cvprompt b{flex:1 1 100%;font-size:14px;color:#1a4a8a}
.cvprompt input{flex:1;width:auto}
.cvprompt input.bad{border-color:#c0392b;background:#fdecea}
.cvprompt button{font:inherit;font-size:15px;min-height:44px;padding:11px 14px;border-radius:10px;border:0;background:#1a5490;color:#fff;font-weight:bold;cursor:pointer}
.cvtb{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.cvtb th{text-align:left;color:var(--suave);font-weight:normal;font-size:13px;padding:4px 0}
.cvtb td{padding:4px 6px 4px 0}
.cvtb input{padding:8px;font-size:15px;min-height:44px}
.cvres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cvres div{background:#f7fbe3;border:1px solid #d8e79a;border-radius:10px;padding:8px 10px;font-size:13px;color:#3a4210}
.cvres b{display:block;font-size:20px;color:var(--negro)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cvuse{display:block;width:100%;margin-top:10px;font:inherit;font-size:15px;padding:12px;border-radius:10px;border:0;background:var(--negro);color:var(--verde);font-weight:bold;cursor:pointer}
.gpsb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;font:inherit;font-size:15px;padding:12px;border-radius:10px;border:2px solid var(--verde-osc);background:#f8fbe9;color:var(--carbon);font-weight:bold;cursor:pointer}
.gpsr{font-size:14px;color:var(--suave);margin-top:6px;min-height:16px}
details.rum{margin-top:12px;border:2px solid var(--borde);border-radius:12px;padding:8px 12px;background:#fbfcf8}
details.rum summary{font-weight:bold;font-size:14px;cursor:pointer;color:var(--carbon);min-height:44px;display:flex;align-items:center}
details.rum textarea{margin-top:8px;min-height:110px;font-size:14px}
.cvbtn{display:block;width:100%;margin-top:8px;font:inherit;font-size:15px;padding:11px;border-radius:10px;border:0;background:var(--negro);color:var(--verde);font-weight:bold;cursor:pointer}
.cvbtn.alt{background:#fff;color:var(--carbon);border:2px solid var(--verde-osc)}
.rumtd{font-size:13px;color:var(--suave);white-space:nowrap}
.cvmode{display:flex;gap:6px;margin:12px 0 0}
.cvmode button{flex:1;font:inherit;font-size:14px;min-height:44px;padding:10px 6px;border-radius:10px;border:2px solid var(--borde);background:#fbfcf8;color:var(--carbon);cursor:pointer}
.cvmode button.on{background:var(--negro);color:var(--verde);border-color:var(--negro);font-weight:bold}
#net{background:#f5c542;color:#16181a;font-size:13px;font-weight:bold;text-align:center;padding:6px 10px}
#net[hidden]{display:none}
.paq{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px;margin:10px 0}
.paq b{display:block;word-break:break-all}
.paq small{color:var(--suave)}
.paq .bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.paq .bt button{font:inherit;font-size:15px;min-height:44px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--negro);background:#fff;color:var(--negro);font-weight:bold;cursor:pointer}
.est{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;margin-left:6px;background:#f5c542}
.est.ok{background:var(--verde)}
.nuevo{display:block;width:100%;margin-top:14px;font:inherit;font-size:14px;padding:11px;border-radius:10px;border:1.5px dashed #b33;background:#fff;color:#b33;font-weight:bold;cursor:pointer}
.hint{font-size:13.5px;color:var(--suave);margin:-2px 0 6px;line-height:1.35}
.hd .pill{font-family:system-ui,sans-serif}
input.bad,textarea.bad{border-color:#c0392b;background:#fdecea}
.ferr{color:#b3261e;font-size:13.5px;font-weight:bold;margin:6px 0 0}
.ferr[hidden]{display:none}
.dist{display:flex;gap:8px;align-items:center}
.dist input{flex:1;min-width:0}
.dist .chips{flex:none;flex-wrap:nowrap}
.dist .chip{min-width:58px}
#proc{position:fixed;top:0;left:0;right:0;z-index:9;background:#f5c542;color:#16181a;font-weight:bold;font-size:15px;text-align:center;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#proc[hidden]{display:none}
.th{position:relative;display:inline-block}
.th .qx{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer}
.th .qx::before{content:"\00d7";display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin:8px;border-radius:50%;background:#c0392b;color:#fff;font:bold 22px/1 system-ui,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.nav button:disabled{opacity:.55}
.cvbtn,.cvuse,.gpsb,.nuevo,label.add{min-height:44px}

/* ===================== Diseño 2026-10-16-j · B Grafito (oscuro) / A Plano claro ===================== */
:root{--bg:#15181b;--card:#1d2125;--ink:#eef1ea;--muted:#9aa394;--line:#323941;--field:#23282d;--acc:#b4d334;--accd:#b4d334;--sel:#b4d334;--selink:#15181b;--hdbg:#0f1113;--hdink:#eef1ea;--soft:#232a1c;--softink:#d6e4a0;--bad:#f07b70;--badbg:#3a1d1a;--hover:#2a3036;--papel:#f4f6ef;color-scheme:dark;
 --negro:#15181b;--carbon:var(--ink);--gris:var(--bg);--borde:var(--line);--txt:var(--ink);--suave:var(--muted);--verde:#b4d334;--verde-osc:#b4d334}
html[data-tema="claro"]{--bg:#f4f5f1;--card:#ffffff;--ink:#16191c;--muted:#5f685b;--line:#d3d8c9;--field:#ffffff;--acc:#b4d334;--accd:#6f8a0b;--sel:#16191c;--selink:#ffffff;--hdbg:#ffffff;--hdink:#16191c;--soft:#f3f8e1;--softink:#3a4210;--bad:#b3261e;--badbg:#fdecea;--hover:#eef1e7;--papel:#fbfcf8;color-scheme:light;
 --negro:#16191c;--verde-osc:#6f8a0b}
body{background:var(--bg);color:var(--ink);font-size:15px}
.ic{width:22px;height:22px;flex:none;display:block}

/* encabezado de una línea */
header{background:var(--hdbg);color:var(--hdink);padding:8px 14px 9px}
header::after{height:3px;background:var(--acc)}
.hd{gap:10px}
.logo{width:auto;padding:3px 4px;border-radius:7px;box-shadow:none;background:#fff}
.logo img{height:28px;width:auto}
.hd .ht{flex:1;min-width:0;line-height:1.15}
.hd h1{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:700;letter-spacing:.01em}
.hd small{margin-top:1px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .pill{margin:0;background:transparent;border:0;color:var(--muted);font-size:11px;padding:0;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
#temaB{flex:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--hdink);display:grid;place-items:center;cursor:pointer;padding:0}
#temaB .ic{width:20px;height:20px}
#bar{height:4px;background:var(--line)}
#bar div{background:var(--acc);border-radius:0 3px 3px 0}

main{padding:12px 14px 100px}
.paso{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:2px 0 1px}
h2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;color:var(--ink);font-size:19px;margin:0 0 10px;padding-left:0;border-left:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px 12px;box-shadow:none;margin-bottom:10px}

/* campos más bajos */
label{display:flex;align-items:center;gap:6px;margin:11px 0 5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;background:var(--field);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(180,211,52,.25);background:var(--field)}
textarea{min-height:76px}
select option{background:var(--field);color:var(--ink)}
.ib{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accd);background:transparent;color:var(--accd);font:italic 700 12px/1 Georgia,serif;display:grid;place-items:center;padding:0;cursor:pointer;margin-left:auto;position:relative}
.ib::after{content:"";position:absolute;inset:-12px}
.ib.on{background:var(--accd);color:var(--selink)}
.hint{display:none;font-size:12.5px;color:var(--muted);margin:0 0 6px;padding:7px 9px;border-radius:8px;background:var(--soft)}
.hint.open{display:block}
.ferr{color:var(--bad)}
input.bad,textarea.bad{border-color:var(--bad);background:var(--badbg)}

/* opciones */
.chips{gap:6px}
.chip{font-size:14px;min-height:40px;padding:7px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--field);color:var(--ink)}
.ambsel{font-size:14px;min-height:40px;padding:7px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);width:auto;max-width:100%}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--selink);font-weight:700}
.revrow{padding:8px 0;border-bottom:1px solid var(--line)}
.revl{font-size:14px;margin-bottom:6px}
.revrow .chip{min-height:40px;font-size:13px;border-radius:9px}

/* tipos de tasación con icono dibujado */
.tiles{gap:8px}
.tile{min-height:78px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);align-items:flex-start;justify-content:flex-start;gap:4px;font-size:14px;text-align:left}
.tile span{font-size:0;color:var(--accd)}
.tile span .ic{width:30px;height:30px}
.tile b{font-size:14px;line-height:1.15}
.tile small{font-size:11.5px;color:var(--muted);line-height:1.2;font-weight:400}
.tile.on{background:var(--sel);border-color:var(--sel);color:var(--selink);box-shadow:none}
.tile.on span,.tile.on small{color:var(--selink)}
.tile.on small{opacity:.8}
.tile:last-child:nth-child(odd){display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;min-height:58px}
.tile:last-child:nth-child(odd) span{grid-row:1/3}

/* barra inferior */
.nav{background:var(--bg);backdrop-filter:none;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.nav button{font-size:15px;padding:0 16px;height:46px;border-radius:11px;background:var(--sel);color:var(--selink)}
.nav button.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.nav button.ok{background:var(--acc);color:#15181b}

/* fotos: una fila por grupo */
.foto{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px 7px 10px;margin:7px 0;box-shadow:none}
.foto .fh{display:flex;align-items:center;gap:10px}
.foto .fh>.ic{color:var(--accd)}
.foto .fn{flex:1;min-width:0;line-height:1.15}
.foto .fn b{display:block;margin:0;font-size:14px;font-weight:600}
.foto .fn small{font-size:11.5px;color:var(--muted)}
.foto .cnt{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-width:24px;height:24px;border-radius:999px;background:var(--sel);color:var(--selink);display:grid;place-items:center;padding:0 7px}
.add{flex:none;width:40px;height:40px;min-height:40px;padding:0;border:1.5px solid var(--accd);border-radius:9px;background:transparent;color:var(--accd);font-size:24px;font-weight:400;line-height:1}
.thumbs{gap:12px;margin-top:0;padding:0 6px 0 0}
.thumbs:not(:empty){margin-top:8px;padding-top:6px}
.thumbs img,.pdfchip{width:58px;height:58px;border-color:var(--card);box-shadow:0 0 0 1px var(--line)}
.pdfchip{background:var(--field);color:var(--ink)}
.msg{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:9px;padding:9px 11px;margin:10px 0;font-size:13px;color:var(--softink)}

/* croquis: lienzo grande, herramientas al costado */
.cvmode{gap:0;margin:10px 0 0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.cvmode button{border:0;border-radius:0;min-height:38px;font-size:13px;padding:6px;background:var(--field);color:var(--ink)}
.cvmode button+button{border-left:1.5px solid var(--line)}
.cvmode button.on{background:var(--sel);color:var(--selink)}
.cvlv{gap:5px;margin:8px 0 6px}
.cvlv button{min-height:34px;font-size:13px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--ink)}
.cvlv button.on{background:var(--sel);border-color:var(--sel);color:var(--selink)}
.cvwrap{position:relative}
#cvCanvas{height:min(64svh,620px);min-height:360px;background:var(--papel);border:1.5px solid var(--line);border-radius:12px}
.cvwrap .cvtools{position:absolute;top:8px;left:8px;margin:0;flex-direction:column;gap:6px;flex-wrap:nowrap}
.cvwrap .cvtools button{width:40px;height:40px;min-height:40px;padding:0;display:grid;place-items:center;border-radius:10px;border:1.5px solid #cfd5c4;background:rgba(255,255,255,.94);color:#16191c;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.cvwrap .cvtools button .ic{width:19px;height:19px}
.cvwrap .cvtools button.on{background:#16191c;color:#b4d334;border-color:#16191c}
.cvwrap .cvtools button:disabled{opacity:.35}
.cvprompt{flex-wrap:nowrap;gap:6px;background:var(--card);border:1.5px solid var(--acc);border-radius:11px;padding:6px 6px 6px 10px;margin-top:8px}
.cvprompt b{flex:none;font-size:13px;color:var(--ink);white-space:nowrap}
.cvprompt input{min-width:0;height:40px;padding:6px 8px;font-family:ui-monospace,Consolas,monospace}
.cvprompt button{min-height:40px;padding:0 12px;border-radius:9px;background:var(--sel);color:var(--selink);font-size:14px;white-space:nowrap}
.cvtb th{color:var(--muted)}
.cvtb input{padding:6px 8px;min-height:40px}
.cvres div{background:var(--soft);border:1px solid var(--line);color:var(--softink)}
.cvres b{color:var(--ink)}
.cvuse,.cvbtn{background:var(--sel);color:var(--selink);border-radius:10px;font-size:14px;padding:11px}
.cvbtn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.gpsb{font-size:14px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-weight:600}
.gpsr{font-size:13px;color:var(--muted)}
details.rum{border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--field)}
details.rum summary{font-size:13.5px;color:var(--ink);min-height:40px}

/* cola de expedientes, avisos y otros */
#net{font-size:12px;padding:5px 10px}
.paq{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.paq small{color:var(--muted)}
.paq .bt button{border:1.5px solid var(--line);background:var(--field);color:var(--ink);min-height:42px;font-size:14px}
.nuevo{background:transparent;border-color:var(--bad);color:var(--bad);font-size:13px;padding:9px}
.est{color:#15181b}
.cvbtn,.cvuse,.gpsb,.nuevo{min-height:42px}

/* 2026-10-16-l · opciones aprendidas */
.chip.apr{border-style:dashed}
.ambtit{font-size:13px;color:var(--suave);margin:10px 0 6px;font-weight:bold}
.chips.amb{margin-bottom:4px}
.ambsel{flex:none;width:auto;max-width:100%;font:inherit;font-size:15px;min-height:44px;padding:9px 12px;border-radius:22px;border:2px solid var(--borde);background:#fbfcf8;color:var(--carbon);cursor:pointer}
.ambbox{margin:2px 0 10px}
.aprg{margin:10px 0}
.aprg b{display:block;font-size:13px;color:var(--muted,#5f685b);margin-bottom:6px}
.aprc{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:4px 4px 4px 10px;border-radius:9px;border:1.5px dashed var(--line,#d3d8c9);background:var(--field,#fff);color:var(--ink,#16191c)}
.aprc button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--bad,#b3261e);font-size:20px;line-height:1;cursor:pointer}
</style>
</head>

document.addEventListener("click",e=>{
  if(e.target.closest("#temaB")){ const c=document.documentElement.getAttribute("data-tema")==="claro"; if(c) document.documentElement.removeAttribute("data-tema"); else document.documentElement.setAttribute("data-tema","claro"); try{localStorage.setItem("nlc_tema",c?"oscuro":"claro")}catch(_){} temaPintar(); if(typeof cvDraw==="function"&&document.getElementById("cvCanvas")) cvDraw(); return; }

});

/* ===== Números (regla del contrato: sin separador de miles y con punto decimal) =====
   «12,5» y «12.5» valen 12.5. «1,500» es ambiguo (¿mil quinientos o uno coma cinco?): se marca en rojo y no deja guardar. */
function numNorm(v,entero){
  let s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(s==="") return "";
  if(/^\d+,\d{1,2}$/.test(s)) s=s.replace(",",".");        /* 12,5 -> 12.5 */
  if(!/^\d+(\.\d+)?$/.test(s)) return null;                  /* 1,500 · 1e3 · -3 · 12.5.1 -> mal escrito */
  if(entero&&/\.\d*[1-9]/.test(s)) return null;              /* 5.5 en un campo entero */
  return s.replace(/\.0+$/,"");                              /* 12.0 -> 12 */
}
function numMsg(v,entero){
  const s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(/^\d+,$/.test(s)) return "Número incompleto: escribe los decimales o borra la coma";
  if(/,/.test(s)&&/^[\d,]+(\.\d+)?$/.test(s)) return "Escribe 1500 o 1500.50, sin coma de miles";
  if(entero&&/^\d+[.,]\d+$/.test(s)) return "Escribe solo un número entero, sin decimales";
  return "Escribe solo el número (por ejemplo 12.5), sin letras ni signos";
}

const AMB_OTROS_KEY="nlc_amb_otros";
const ambNorm=s=>String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function ambOtrosGet(){ try{const a=JSON.parse(localStorage.getItem(AMB_OTROS_KEY)||"[]");return Array.isArray(a)?a.slice(0,14):[];}catch(e){return [];} }
function ambOtrosPon(n){ try{const a=ambOtrosGet(); if(!a.some(x=>ambNorm(x)===ambNorm(n))){a.unshift(n);localStorage.setItem(AMB_OTROS_KEY,JSON.stringify(a.slice(0,14)));}}catch(e){} }
function ambBase(et){ const n=ambNorm(et);
  if(n.indexOf("marquesina")===0) return "marquesina";

  return null; }
function ambLeer(t){ return String(t==null?"":t).split(/\s*,\s*/).filter(x=>x.trim()).map(x=>{
    const m=/^\(\s*(\d+)?\s*(½)?\s*\)\s*(.+?)\s*$/.exec(x.trim());
    if(!m) return {crudo:x.trim()};

  }); }
/* Plural de un ambiente escrito a mano: se pluraliza solo la primera palabra.
   «gazebo»->«gazebos», «caseta de planta»->«casetas de planta», «lapiz»->«lapices». */
function ambPlural(et){ const w=String(et||"").split(" "); if(!w.length||!w[0]) return et;
  let c=w[0];
  if(/[sx]$/i.test(c)) return et;
  if(/z$/i.test(c)) c=c.slice(0,-1)+"ces";
  else if(/[aeiouáéíóú]$/i.test(c)) c=c+"s";
  else c=c+"es";
  w[0]=c; return w.join(" "); }
function ambUno(p){ if(p.crudo!==undefined) return p.crudo;
  let et=p.et; const mas=(p.n>1||(p.n>=1&&p.medio));
  if(p.base && p.base!=="marquesina"){ const par=AMB_LISTA.find(a=>a[0]===p.base); if(par) et=mas?par[1]:par[0]; }
  else if(!p.base && mas) et=ambPlural(et);
  return "("+(p.n>0?p.n:"")+(p.medio?(p.n>0?" ½":"½"):"")+") "+et; }
function ambTexto(a){ const s=a.map(ambUno).filter(x=>x&&x.trim()).join(", ");
  return s.replace(/^(\([^)]*\)\s*)(\p{Ll})/u,(m,c,l)=>c+l.toUpperCase()); }
/* ===== Niveles (2026-10-18-y): pestañas por nivel; cada ambiente va al nivel de la pestaña activa ===== */
const AMB_ORD=["1er","2do","3er","4to","5to","6to","7mo","8vo","9no","10mo","11vo","12vo"];
let _ambN=1,_ambAct=0,_ambTxt=null;
function ambNivParse(t){ t=String(t==null?"":t);
  const re=/(\d+)\s*(?:er|ro|do|to|vo|mo|no)?\s*nivel\s*:/gi; const ix=[]; let m;
  while((m=re.exec(t))) ix.push({n:+m[1],s:m.index,e:re.lastIndex});
  if(!ix.length) return [ambLeer(t)];
  const out=[]; const pre=t.slice(0,ix[0].s).replace(/[.\s,]+$/,"").trim();
  for(let i=0;i<ix.length;i++){
    const seg=t.slice(ix[i].e, ix[i+1]?ix[i+1].s:t.length).replace(/[.\s,]+$/,"").replace(/^[\s,]+/,"");
    const k=Math.min(Math.max(ix[i].n,1),12)-1; out[k]=(out[k]||[]).concat(ambLeer(seg)); }
  if(pre) out[0]=ambLeer(pre).concat(out[0]||[]);
  for(let i=0;i<out.length;i++) if(!out[i]) out[i]=[];
  return out; }
function ambNivTexto(L){ const n=Math.max(L.length,1);
  if(n<=1) return ambTexto(L[0]||[]);
  return L.map((a,i)=>(a&&a.length)?(AMB_ORD[i]+" nivel: "+ambTexto(a)):"").filter(Boolean).join(". "); }
function ambNiveles(){ const L=ambNivParse(D_[AMB_K]||"");
  if(L.length>_ambN) _ambN=L.length;
  while(L.length<_ambN) L.push([]);

let _ambPila=[];
function ambPon(t){ const prev=D_[AMB_K]||""; if(t===prev){ _ambTxt=t; return; }

function ambGuardar(L){ ambPon(ambNivTexto(L)); }
function ambAgregar(base,etiqueta){
  const L=ambNiveles(); const a=L[_ambAct];
  if(base==="marquesina"){
    L.forEach((x,k)=>{ const j=x.findIndex(p=>p.base==="marquesina"); if(j>=0) x.splice(j,1); });
    L[0].unshift({n:1,medio:false,et:etiqueta,base:"marquesina"});
  }else{
    const i=a.findIndex(p=>p.base===base&&base!=null || (base==null&&p.et===etiqueta));
    if(i>=0) a[i].n++; else a.push({n:1,medio:false,et:etiqueta||base,base:base||null});
  }
  ambGuardar(L);
}
function ambMedio(){ const L=ambNiveles(); const a=L[_ambAct];
  const i=a.findIndex(p=>p.base==="baño");
  if(i>=0) a[i].medio=!a[i].medio; else a.push({n:0,medio:true,et:"baño",base:"baño"});

function ambConBano(){ const L=ambNiveles(); const a=L[_ambAct];
  const i=a.map(p=>p.base).lastIndexOf("dormitorio de servicio");
  if(i<0){ alert("Primero toca «dormitorio de servicio» y después «+ con baño»."); return; }

function ambDeshacer(){ if(!_ambPila.length) return; const t=_ambPila.pop();
  D_[AMB_K]=t; _ambTxt=t; save(); const ta=document.getElementById("f_"+AMB_K); if(ta) ta.value=t;

function ambNombreNivel(i){ return "Nivel "+(i+1); }
function ambCaja(){

    </div>

function ambRefrescar(){
  const c=document.querySelector("[data-ambbox]"); if(!c) return;
  const t=document.createElement("div"); t.innerHTML=ambCaja(); c.replaceWith(t.firstElementChild); ambEnganchar(); }
function ambFijarNiveles(n){ const L=ambNiveles();
  for(let i=n;i<L.length;i++) if(L[i].length){ alert("El "+ambNombreNivel(i)+" tiene ambientes. Bórralos primero (o pasa a ese nivel y usa Deshacer)."); return; }
  _ambN=Math.max(1,Math.min(12,n)); if(_ambAct>=_ambN) _ambAct=_ambN-1;
  ambGuardar(L.slice(0,_ambN)); ambRefrescar(); }
function ambEnganchar(){
  const c=document.querySelector("[data-ambbox]"); if(!c) return;
  const fila=c.querySelector("[data-marqrow]");
  c.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.marqtog!==undefined){ if(fila) fila.hidden=!fila.hidden; return; }
    if(b.dataset.marq!==undefined){ ambAgregar("marquesina",b.dataset.marq); if(fila) fila.hidden=true; return; }
    if(b.dataset.ini!==undefined){ ambPon(AMB_INI[b.dataset.ini]||""); _ambN=Math.max(1,ambNivParse(AMB_INI[b.dataset.ini]||"").length); _ambAct=0; ambRefrescar(); return; }
    if(b.dataset.nn!==undefined){ ambFijarNiveles(+b.dataset.nn); return; }
    if(b.dataset.nmas!==undefined){ ambFijarNiveles(_ambN+1); return; }
    if(b.dataset.tab!==undefined){ _ambAct=+b.dataset.tab; ambRefrescar(); return; }
    if(b.dataset.copia!==undefined){ const L=ambNiveles(); if(_ambAct>0){ L[_ambAct]=L[_ambAct-1].map(p=>Object.assign({},p)); ambGuardar(L); } return; }
    if(b.dataset.add!==undefined){ ambAgregar(ambBase(b.dataset.add),b.dataset.add); return; }
    if(b.dataset.medio!==undefined){ ambMedio(); return; }
    if(b.dataset.conb!==undefined){ ambConBano(); return; }
    if(b.dataset.undo!==undefined){ ambDeshacer(); return; }
    if(b.dataset.clr!==undefined){ if(confirm("¿Borrar toda la distribución?")){ ambPon(""); _ambN=1; _ambAct=0; ambRefrescar(); } return; }
    if(b.dataset.otro!==undefined){
      const n=(prompt("¿Qué ambiente quieres agregar"+(_ambN>1?" al "+ambNombreNivel(_ambAct):"")+"?\n\nEjemplos: caseta de planta, cisterna, gazebo, piscina.")||"").trim();
      if(!n) return;
      ambOtrosPon(n); ambAgregar(ambBase(n),n);
      const ta=document.getElementById("f_"+AMB_K); render(); if(ta){ const t2=document.getElementById("f_"+AMB_K); if(t2) t2.focus(); }
      return;
    }
  });
}
/* ===== 2026-10-18-z · Características constructivas armadas solas + materiales por nivel + «Otro» se aprende al salir ===== */

const CAR_ORDEN=[["SISTEMA_ESTRUCTURAL","Sistema estructural"],["PAREDES","Paredes"],["ENTREPISO","Entrepiso"],["TECHOS","Techos"],["PISOS","Pisos"],["PUERTA_PRINCIPAL","Puerta principal"],["PUERTAS_INTERIORES","Puertas interiores"],["CLOSETS","Clósets"],["VENTANAS","Ventanas"],["PROTECCION_HIERRO","Protección de hierro"],["TERMINACION","Terminación"]];
function nivN(){ return Math.max(1,ambNivParse(D_[AMB_K]||"").length); }
function carVal(k){ const v=D_[k]; if(!v) return ""; return ES_OTRO(v)?String(D_[k+"__OTRO"]||"").trim():String(v); }
function carBaja(t){ t=String(t||""); return (t.length>1&&t[0]===t[0].toUpperCase()&&t[1]===t[1].toLowerCase()&&/[A-ZÁÉÍÓÚÑ]/.test(t[0]))?t[0].toLowerCase()+t.slice(1):t; }
function carLista(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1]; }
function carNiv(k){ const v1=carVal(k); if(!v1||!NIV_KEYS[k]) return v1; const n=nivN(); if(n<2) return v1;
  const g=[]; for(let i=1;i<=n;i++){ let v=i===1?v1:(D_[k+"__N"+i]||""); if(ES_OTRO(v)) v=""; if(!v) v=v1;

};

function cvClose(){
  const p=cvPts(); if(p.length<3||cvClosed[cvLevel]) return;
  cvPush(); cvClosed[cvLevel]=true;
  const a=p[p.length-1], b=p[0]; a.angle=((Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI)+360)%360;
  cvSel=cvNextSel(-1); cvSave(); cvUI(); cvDraw();
}
function cvDeleteLevel(){

  for(let l=cvLevel;l<MAX_LEVELS;l++){cvLevels[l]=cvLevels[l+1];cvUndo[l]=cvUndo[l+1];cvRedo[l]=cvRedo[l+1];cvClosed[l]=cvClosed[l+1];}
  cvLevels[MAX_LEVELS]=[];cvUndo[MAX_LEVELS]=[];cvRedo[MAX_LEVELS]=[];cvClosed[MAX_LEVELS]=false;
  if(cvUsed>1) cvUsed--; if(cvLevel>cvUsed) cvLevel=cvUsed; cvSel=null; cvSave(); cvUI(); cvDraw();
}

function cvResize(){

}
function cvAdd(pt){
  const p=cvPts();
  if(p.length){
    const prev=p[p.length-1]; const dx=pt.x-prev.x, dy=pt.y-prev.y, len=Math.hypot(dx,dy);
    if(len<14) return;
    let a=Math.atan2(dy,dx);
    if(cvSnap){a=Math.round(a/(Math.PI/4))*(Math.PI/4); pt={x:prev.x+len*Math.cos(a),y:prev.y+len*Math.sin(a)};}
    cvPush();
    prev.angle=((a*180/Math.PI)+360)%360;
  } else cvPush();
  p.push({x:pt.x,y:pt.y,measure:null,angle:null});
  cvSave(); cvUI(); cvDraw();
}

function cvPath(ctx,p,color,full){
  const n=p.length; if(!n) return;
  const draw=cvMode==="draw", closed=full&&draw&&cvClosed[cvLevel]&&n>=3, segs=n>1?n-1+(closed?1:0):0;
  ctx.lineJoin="round"; ctx.lineCap="round";
  for(let i=0;i<segs;i++){
    const a=p[i], b=p[(i+1)%n], un=full&&draw&&!(a.measure>0), sel=full&&draw&&cvSel===i;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.setLineDash(un&&!sel?[8,6]:[]); ctx.strokeStyle=sel?"#d35400":(un?"#8a9380":color); ctx.lineWidth=sel?6:(full?3:2); ctx.stroke();
  }

  for(let i=0;i<segs;i++){
    const a=p[i], b=p[(i+1)%n], has=a.measure>0, sel=draw&&cvSel===i;
    if(!has&&!draw) continue;
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, t=has?cvFmt(a.measure)+" m":"?", w=Math.max(ctx.measureText(t).width+10,24);
    ctx.fillStyle=sel?"#fff3d6":"rgba(255,255,255,.93)"; ctx.fillRect(mx-w/2,my-10,w,20);
    if(sel){ctx.strokeStyle="#d35400";ctx.lineWidth=2;ctx.strokeRect(mx-w/2,my-10,w,20);}
    ctx.fillStyle=has?color:"#c0392b"; ctx.fillText(t,mx,my);

    ctx.beginPath(); ctx.arc(q.x,q.y,last?11:9,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
    if(last&&!closed){ctx.lineWidth=3;ctx.strokeStyle="#b4d334";ctx.stroke();}
    if(i===0&&draw&&!closed&&n>=3){ctx.beginPath();ctx.arc(q.x,q.y,15,0,Math.PI*2);ctx.lineWidth=3;ctx.strokeStyle="#b4d334";ctx.stroke();}
    ctx.fillStyle="#fff"; ctx.font="bold 12px Cambria,Georgia,serif"; ctx.fillText(cvLet(i),q.x,q.y+1);
  });
}
function cvDraw(){
  if(!cv) return; const {canvas,ctx}=cv, r=canvas.getBoundingClientRect(), W=r.width, H=r.height;
  ctx.clearRect(0,0,W,H); ctx.strokeStyle="#e4e9d6"; ctx.lineWidth=1;
  for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let l=1;l<=MAX_LEVELS;l++){ if(l===cvLevel)continue; const q=cvLevels[l]; if(q&&q.length>1){ctx.globalAlpha=.22;cvPath(ctx,q,LEVEL_COLORS[l],false);ctx.globalAlpha=1;} }
  const p=cvPts(); cvPath(ctx,p,LEVEL_COLORS[cvLevel],true);
  if(p.length&&cvCursor&&cvDrag===null&&!cvPend()&&!(cvMode==="draw"&&cvClosed[cvLevel])){
    const prev=p[p.length-1]; let ex=cvCursor.x, ey=cvCursor.y;
    if(cvSnap){const dx=ex-prev.x,dy=ey-prev.y,len=Math.hypot(dx,dy),a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);ex=prev.x+len*Math.cos(a);ey=prev.y+len*Math.sin(a);}
    ctx.setLineDash([6,6]); ctx.strokeStyle="#9aa38a"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(ex,ey); ctx.stroke(); ctx.setLineDash([]);

}
function cvBearingOfSide(p,i){

function cvCroquis(l){

  g.fillStyle="#16181a"; g.font="bold 28px Cambria,Georgia,serif"; g.textAlign="left"; g.fillText(`Croquis — Nivel ${l}`,30,58);
  g.font="20px Cambria,Georgia,serif"; g.fillText(`Área: ${r.area.toFixed(2)} m²   ·   Perímetro: ${r.perimeter.toFixed(2)} m`,30,88);
  g.beginPath(); c.forEach((q,i)=>i?g.lineTo(X(q),Y(q)):g.moveTo(X(q),Y(q))); g.closePath();
  g.fillStyle=col+"22"; g.fill(); g.lineWidth=4; g.strokeStyle=col; g.lineJoin="round"; g.stroke();
  g.textAlign="center"; g.textBaseline="middle"; g.font="bold 18px Cambria,Georgia,serif";
  for(let i=0;i<n;i++){
    const a=c[i], b=c[(i+1)%n], mx=(X(a)+X(b))/2, my=(Y(a)+Y(b))/2, t=cvFmt(p[i].measure)+" m", w=g.measureText(t).width+12;
    g.fillStyle="rgba(255,255,255,.95)"; g.fillRect(mx-w/2,my-13,w,26); g.fillStyle=col; g.fillText(t,mx,my);
  }
  for(let i=0;i<n;i++){
    g.beginPath(); g.arc(X(c[i]),Y(c[i]),14,0,Math.PI*2); g.fillStyle=col; g.fill();
    g.fillStyle="#fff"; g.font="bold 15px Cambria,Georgia,serif"; g.fillText(cvLet(i),X(c[i]),Y(c[i])+1);
  }
  g.fillStyle="#6b7280"; g.font="15px Cambria,Georgia,serif"; g.textAlign="left"; g.textBaseline="alphabetic";
  g.fillText("NLC Arquitectos · Arq. Nelson de León C. · croquis a partir de las medidas de campo",30,H-24);
  return cn;
}
/* ===== GPS ===== */
/* Espera una buena lectura (hasta ±15 m, máximo 45 s). Si queda peor de ±25 m, lo avisa. Pregunta antes de reemplazar coordenadas escritas a mano. */
let _gpsId=null;
function bindGPS(){
  document.querySelectorAll("[data-gps]").forEach(b=>b.onclick=()=>{
    const out=b.parentElement.querySelector(".gpsr");
    if(!window.isSecureContext){ out.textContent="El GPS solo funciona abriendo la app desde su enlace https (el de GitHub Pages). Mientras tanto escribe las coordenadas a mano."; return; }
    if(!navigator.geolocation){out.textContent="Este navegador no permite tomar la ubicación. Escribe las coordenadas a mano.";return;}
    const ya=String(D_.COORDENADAS||"").trim();
    if(ya&&!/^-?\d+\.\d+, -?\d+\.\d+$/.test(ya)&&!confirm("¿Reemplazar las coordenadas escritas («"+ya+"») por las del GPS?")) return;
    if(_gpsId!=null){ try{navigator.geolocation.clearWatch(_gpsId)}catch(e){} _gpsId=null; }
    let mejor=null, listo=false, tm=null, id=null;
    const parar=()=>{ listo=true; clearTimeout(tm); if(id!=null) navigator.geolocation.clearWatch(id); if(_gpsId===id) _gpsId=null; };
    const fin=()=>{ if(listo) return; parar();
      if(!mejor){ out.textContent="No se pudo tomar la ubicación (sin señal GPS). Sal al aire libre y repite, o escríbela a mano."; return; }
      const c=mejor.coords, a=Math.round(c.accuracy);
      D_.COORDENADAS=c.latitude.toFixed(6)+", "+c.longitude.toFixed(6); D_.UBICACION_PRECISION_M=String(a); save();
      const inp=document.getElementById("f_COORDENADAS"); if(inp) inp.value=D_.COORDENADAS;
      out.textContent=a<=25?"✔ "+D_.COORDENADAS+" (precisión ±"+a+" m)":"⚠ Precisión baja (±"+a+" m): "+D_.COORDENADAS+". Sal al aire libre, lejos de techos y árboles, y repite.";
    };
    out.textContent="Buscando ubicación… mejor al aire libre (puede tardar hasta 45 s).";
    id=navigator.geolocation.watchPosition(pos=>{
      if(listo) return;
      if(!mejor||pos.coords.accuracy<mejor.coords.accuracy) mejor=pos;
      const a=Math.round(mejor.coords.accuracy); out.textContent="Afinando… ±"+a+" m (espera hasta ±15 m)";
      if(a<=15) fin();
    },err=>{
      if(listo) return;
      if(err.code===1){ parar(); out.textContent="No se pudo tomar la ubicación (permiso denegado: actívalo en los permisos del sitio). Puedes escribirla a mano."; }
      /* sin señal todavía: se sigue esperando hasta los 45 s */
    },{enableHighAccuracy:true,maximumAge:0,timeout:45000});
    _gpsId=id; tm=setTimeout(fin,45000);
  });
}
/* ===== Rumbos y distancias (cuadro del plano catastral) ===== */
function cvBearing(angDeg){
  const az=(((angDeg+90)%360)+360)%360; let q, a;
  if(az<=90){q=["N","E"];a=az;} else if(az<=180){q=["S","E"];a=180-az;} else if(az<270){q=["S","W"];a=az-180;} else {q=["N","W"];a=360-az;}
  let d=Math.floor(a), m=Math.round((a-d)*60); if(m===60){d+=1;m=0;}
  return `${q[0]} ${String(d).padStart(2,"0")}°${String(m).padStart(2,"0")}' ${q[1]}`;
}
function cvParseRumbos(text){
  const rows=[];
  text.split(/\n+/).forEach(line=>{
    /* acepta «N 86°24' E 13.60», «N86°24'E 13.60» (sin espacios) y «13.60 N 86°24' E» (distancia delante) */
    const s=line.replace(/^\s*\d+\s*(?:[\)\-:]|\.(?!\d))\s*/,"").replace(/[°º˚'’′´"”″]/g," ").replace(/,(?=\d{1,2}\b)/g,".");
    const m=s.match(/(?<![A-Za-z])([NS])\s*([\d.\s]+?)\s*([EWO])(?![A-Za-z])(.*)$/i); if(!m) return;
    const bn=(m[2].match(/\d+(?:\.\d+)?/g)||[]).map(Number); let dm=m[4].match(/\d+(?:[.,]\d+)?/);
    if(!dm) dm=s.slice(0,m.index).match(/\d+(?:[.,]\d+)?/);
    if(!bn.length||!dm) return;
    const deg=bn[0]+(bn[1]||0)/60+(bn[2]||0)/3600, dist=parseFloat(dm[0].replace(",","."));
    const ns=m[1].toUpperCase(), ew=m[3].toUpperCase()==="E"?"E":"W";
    let az; if(ns==="N"&&ew==="E")az=deg; else if(ns==="S"&&ew==="E")az=180-deg; else if(ns==="S"&&ew==="W")az=180+deg; else az=360-deg;
    if(dist>0) rows.push({az,dist});
  });
  return rows;
}
function cvFromRumbos(text){
  const rows=cvParseRumbos(text);
  if(rows.length<3) return "No pude leer al menos 3 lados. Usa el formato: N 86°24' E 13.60 m (uno por línea).";
  const raw=[{x:0,y:0}];
  rows.forEach((r,i)=>{const l=raw[i], a=r.az*Math.PI/180; raw.push({x:l.x+r.dist*Math.sin(a), y:l.y-r.dist*Math.cos(a)});});
  const pts=raw.slice(0,rows.length);
  const xs=pts.map(q=>q.x), ys=pts.map(q=>q.y), minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const cr=cv.canvas.getBoundingClientRect(), mg=60;
  const s=Math.min((cr.width-2*mg)/Math.max(maxX-minX,1e-6),(cr.height-2*mg)/Math.max(maxY-minY,1e-6));
  const ox=(cr.width-(maxX-minX)*s)/2-minX*s, oy=(cr.height-(maxY-minY)*s)/2-minY*s;
  cvPush();
  cvLevels[cvLevel]=pts.map((q,i)=>({x:q.x*s+ox,y:q.y*s+oy,measure:rows[i].dist,angle:((rows[i].az-90)%360+360)%360}));
  cvClosed[cvLevel]=true; cvSel=null; cvSave();
  const r=cvCalc(cvLevel);
  return `✔ ${rows.length} lados cargados.`+(r&&!r.incomplete?` Área ${r.area.toFixed(2)} m², error de cierre ${r.pct.toFixed(2)} %.`:"");
}
/* ===== Linderos desde el polígono (arriba = Norte) ===== */
function cvLinderos(){
  const r=cvCalc(cvLevel); if(!r||r.incomplete) return "Primero completa el polígono con todas sus medidas.";
  const p=cvPts(), c=r.coords, n=c.length; let N=0,S=0,E=0,O=0, mN=1e9,mS=-1e9,mE=-1e9,mO=1e9;
  for(let i=0;i<n;i++){
    const a=c[i], b=c[(i+1)%n], mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(my<mN){mN=my;N=i;} if(my>mS){mS=my;S=i;} if(mx>mE){mE=mx;E=i;} if(mx<mO){mO=mx;O=i;}
  }
  D_.DIMENSION_LINDERO_NORTE=String(+p[N].measure.toFixed(2)); D_.DIMENSION_LINDERO_SUR=String(+p[S].measure.toFixed(2));
  D_.DIMENSION_LINDERO_ESTE=String(+p[E].measure.toFixed(2)); D_.DIMENSION_LINDERO_OESTE=String(+p[O].measure.toFixed(2)); save();
  const L=i=>cvLet(i)+"–"+cvLet((i+1)%n);
  return `✔ Norte ${L(N)} ${cvFmt(p[N].measure)} m · Sur ${L(S)} ${cvFmt(p[S].measure)} m · Este ${L(E)} ${cvFmt(p[E].measure)} m · Oeste ${L(O)} ${cvFmt(p[O].measure)} m. Los colindantes los escribes tú.`;
}

/* ===== Modo de medida: a mano (siempre funciona) o con laser en modo teclado ===== */

function medAplicar(){
  document.querySelectorAll("[data-med]").forEach(b=>b.classList.toggle("on",b.dataset.med===medModo));

/* ===== Medidor láser Leica DISTO por Bluetooth (experimental: probar con tu equipo) ===== */
const DISTO_SVC="3ab10100-f831-4395-b29d-570977d5bf94", DISTO_CH=["3ab10101"];   /* solo el canal de distancia documentado (float32, metros) */
let laser=null, laserUlt={v:null,t:0};
function laserMsg(t){const m=document.getElementById("laserMsg"); if(m) m.textContent=t;}
function laserRecibe(v){
  if(!(v>0.02&&v<1000)) return;
  const now=Date.now(); if(laserUlt.v===v&&now-laserUlt.t<2000) return; laserUlt={v,t:now};
  const val=Math.round(v*100)/100, inp=document.getElementById("cvMeas"), pr=document.getElementById("cvPrompt");
  if(inp&&pr&&!pr.hidden){
    inp.value=String(val); laserMsg("📏 "+val.toFixed(2)+" m recibido");
    setTimeout(()=>{ if(document.getElementById("cvMeas")===inp&&inp.value===String(val)) cvConfirm(); },700);
  } else laserMsg("📏 "+val.toFixed(2)+" m recibido, pero ningún lado está esperando medida. Cierra la forma o toca una línea y vuelve a medir.");
}
async function laserConectar(){
  if(!window.isSecureContext){laserMsg("Abre la app desde su enlace https (el de GitHub Pages) para usar el láser por Bluetooth. Mientras tanto escribe las medidas a mano."); return;}
  if(!navigator.bluetooth){laserMsg("Este navegador no permite Bluetooth web. Usa Chrome en Android (en iPhone no funciona). Mientras tanto escribe las medidas a mano."); return;}
  try{
    laserMsg("Buscando… enciende el láser y su Bluetooth.");
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[DISTO_SVC]},{namePrefix:"DISTO"}],optionalServices:[DISTO_SVC]});
    dev.addEventListener("gattserverdisconnected",()=>{laser=null;laserMsg("Láser desconectado. Toca el botón para reconectar.");});
    const srv=await dev.gatt.connect(), svc=await srv.getPrimaryService(DISTO_SVC), chs=await svc.getCharacteristics(); let n=0;
    for(const c of chs){
      if(!DISTO_CH.some(u=>c.uuid.startsWith(u))||!(c.properties.notify||c.properties.indicate)) continue;
      try{ c.addEventListener("characteristicvaluechanged",e=>{const dv=e.target.value; if(dv&&dv.byteLength>=4) laserRecibe(dv.getFloat32(0,true));}); await c.startNotifications(); n++; }catch(_){}
    }
    laser={dev};
    laserMsg(n?"✔ Conectado a "+(dev.name||"láser")+". Mide cada lado con el láser y se escribe solo.":"Conectado, pero no encontré el canal de medidas de este modelo. Escribe las medidas a mano.");
  }catch(e){ laserMsg(e&&e.name==="NotFoundError"?"No elegiste ningún aparato.":"No se pudo conectar ("+((e&&e.message)||e)+")."); }
}

/* ===== Aviso de versión nueva: compara APP_VER con el index.html publicado y ofrece actualizar (no se pierde nada) ===== */
async function buscarVersion(){
  if(navigator.onLine===false||!/^https?:/.test(location.protocol)||document.getElementById("upd")) return;
  try{
    const t=await (await fetch("index.html",{cache:"no-store"})).text();   /* el service worker deja pasar esta petición */
    const v=(t.match(/const APP_VER="([^"]+)"/)||[])[1];
    if(!v||v===APP_VER||document.getElementById("upd")) return;
    if(window.caches){ for(const k of await caches.keys()){ if(k.indexOf("nlc-form-")===0){ const c=await caches.open(k); await c.put(new URL("index.html",location.href).href,new Response(t,{headers:{"Content-Type":"text/html; charset=utf-8"}})); } } }
    const d=document.createElement("button"); d.id="upd"; d.type="button";
    d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:10;min-height:52px;padding:12px;border:0;background:#f5c542;color:#16181a;font:bold 16px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)";
    d.textContent="🔄 Hay una versión nueva del formulario. Toca aquí para actualizar (no se pierde nada).";
    d.onclick=async()=>{ d.disabled=true; d.textContent="Actualizando…"; try{ const r=await navigator.serviceWorker.getRegistration(); if(r) await r.update(); }catch(e){} location.reload(); };
    document.body.appendChild(d);
  }catch(e){}
}
addEventListener("load",()=>setTimeout(buscarVersion,3000));
